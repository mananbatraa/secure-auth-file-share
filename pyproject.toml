[project]
name = "secure-auth-file-share"
version = "0.1.0"
description = "FastAPI service with JWT auth, refresh-token rotation with reuse detection, OAuth, RBAC and secure file sharing on S3 with expiring links."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "redis>=5.0",
  "boto3>=1.34",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "fakeredis[lua]>=2.24",
  "moto[s3,server]>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "boto3-stubs[s3]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["moto.*", "fakeredis.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app.*"]
