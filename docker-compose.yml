# Local stack: API + Postgres + Redis + MinIO.  `docker compose up --build`
# Swagger UI: http://localhost:8000/docs   MinIO console: http://localhost:9001
x-api-env: &api-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fileshare
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-local-dev-secret}
  S3_ENDPOINT_URL: http://minio:9000
  # Presigned URLs are opened by your browser, so sign them for the host-visible address.
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_BUCKET: fileshare
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_CREATE_BUCKET: "true"
  OAUTH_REDIRECT_BASE_URL: http://localhost:8000
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fileshare
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  # Sweeps expired upload intents (and their S3 objects), tokens, grants and links.
  cleanup:
    build: .
    command: ["python", "-m", "app.cleanup"]
    healthcheck: { disable: true }  # the image healthcheck probes the API port
    environment:
      <<: *api-env
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-3600}
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
